<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PDF 查看器</title>
    <style>
        /* 彻底重置所有边距和填充，确保没有任何多余空间 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* html 和 body 完全占满窗口，无滚动条（除非 PDF 内部需要滚动） */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;      /* 防止浏览器自身滚动条干扰 */
            background: #525659;   /* 柔和底色，与 PDF 阅读器背景相似，仅在加载时或非满屏时可见，不影响内容 */
        }

        /* 直接使用 iframe 全屏嵌入 PDF，无任何边框或额外元素 */
        .pdf-viewer {
            display: block;
            width: 100%;
            height: 100%;
            border: none;          /* 移除边框 */
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- 
        仅包含一个全屏 iframe，专门用于显示 PDF 文件。
        请将下方 src 中的 "your-pdf-file.pdf" 替换为你实际的 PDF 文件路径（相对路径或完整 URL）。
        例如: src="documents/manual.pdf"  或  src="https://example.com/files/sample.pdf"
    -->
    <iframe 
        class="pdf-viewer" 
        src="RXF Advertising.pdf" 
        title="PDF 文档"
        aria-label="PDF 文档显示区域"
        loading="lazy"
    >
        <!-- 极简后备提示：仅当浏览器完全不支持嵌入 PDF 时显示（现代浏览器基本都支持） -->
        <p style="font-family: system-ui; text-align: center; margin-top: 2rem;">
            您的浏览器无法直接显示 PDF 文件，请<a href="your-pdf-file.pdf">点击下载</a>查看。
        </p>
    </iframe>
</body>
</html>
